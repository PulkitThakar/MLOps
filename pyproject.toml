[project]
name = "MLOps"
version = "0.1.0"
description = "A project to employ CI/CD with Machine Learning models - in this case Weather Prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dm-haiku>=0.0.16",
    "graphcast",
    "jax[cuda13]>=0.10.0",
    "pyyaml>=6.0.3",
    "xarray<2026.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv.sources]
graphcast = { git = "https://github.com/google-deepmind/graphcast.git" }
